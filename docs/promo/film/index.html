<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>DCTimer · HarmonyOS 产品演示</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0E1A2B;}
  #cv{display:block;width:100%;height:100%;}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script type="module">
/* ============================================================
   DCTimer 鸿蒙版 · 产品演示片（真实界面实录版）
   ------------------------------------------------------------
   素材：全部来自 DevEco 模拟器 snapshot_display 抓取的 1280×2832
        真机原生帧（assets/）。本页只用真实截图 + 极简文字浮层 +
        光感渐变底 + UI 展开式转场，不重绘任何 App 界面元素。
   风格：lemo-opuscar / dark-keynote（暗色科技发布）
   视口：按 innerWidth / innerHeight 布局，适配任意 --size。
   ============================================================ */
import { clamp, lerp, seg, ss, eio, eo, ei, back, spring } from '/core/lib.js';

const cv = document.getElementById('cv');
const g = cv.getContext('2d');
let W = 0, H = 0, S = 1;

/* ---------- 尺度与色板 ---------- */
const ACCENT = '#448AFF';
const INK = '#F2F6FF';
const SUB = 'rgba(186,205,238,0.72)';
const APP_BG = ['#0E1A2B', '#122A3D', '#12302C', '#1A1830'];

const FH = '"Bahnschrift","Inter","Segoe UI",sans-serif';
const FZ = '"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif';
const FM = '"Consolas","JetBrains Mono",monospace';

/* ---------- 真实截图 ---------- */
const SRC = {
  timer:   'assets/s1_timer.jpeg',
  confirm: 'assets/s2_confirm.jpeg',
  results: 'assets/s3_results.jpeg',
  chart:   'assets/s4_chart.jpeg',
  dropdown:'assets/s5_dropdown.jpeg',
  cfop:    'assets/s6_cfop.jpeg',
  settings:'assets/s7_settings_dark.jpeg',
  dark:    'assets/s8_timer_dark.jpeg',
  // WCA 观察倒计时真实动态帧（15 / 14 / 13 / 12）
  obs15:   'assets/motion1.jpeg',
  obs14:   'assets/motion3.jpeg',
  obs13:   'assets/motion8.jpeg',
  obs12:   'assets/motion12.jpeg',
};
const IMG = {};
let loaded = 0;

/* ---------- 分镜（横屏 16:9 / 66s / 9 镜） ----------
   每镜：t0,t1, 手机里显示的截图 key（或 'obs' 动态）, 文案, 强调标签
---------------------------------------------------------- */
const SHOTS = [
  { t0:0,  t1:7,  img:'timer',    tag:'00 / INTRO',      title:['DCTimer','鸿蒙原生 · 魔方计时器'], sub:'141 种打乱  ·  全场求解器  ·  沉浸光感', accent:true },
  { t0:7,  t1:15, img:'obs',      tag:'01 / TIMER',      title:['WCA 观察','15 秒倒计时 · 真实计时实录'], sub:'起停手感 / 分段计时 / 双精度切换' },
  { t0:15, t1:22, img:'dropdown', tag:'02 / SCRAMBLE',   title:['打乱','22 组分类 · 毛玻璃面板'], sub:'三阶 F2L / OLL / PLL 训练一步到位' },
  { t0:22, t1:29, img:'confirm',  tag:'03 / RESULT',     title:['确认成绩','色调胶囊 · 判罚一触即达'], sub:'+2 / DNF / 备注 / 删除' },
  { t0:29, t1:36, img:'results',  tag:'04 / SESSION',    title:['成绩管理','分组 · 均值 · 标准差'], sub:'16 次成绩一目了然，最佳高亮' },
  { t0:36, t1:43, img:'chart',    tag:'05 / TREND',      title:['趋势分析','折线生长 · 平均虚线'], sub:'状态起伏，一眼看懂' },
  { t0:43, t1:51, img:'cfop',     tag:'06 / SOLVER',     title:['全场求解器','十字 · CFOP · 桥式 · ZZ · Petrus'], sub:'总步数 57 · 逐段解法 · 验证通过' },
  { t0:51, t1:59, img:'settings', tag:'07 / AMBIENT',    title:['沉浸光感','深色模式 · 光感配色'], sub:'系统材质 / 顶栏弹窗半透明模糊' },
  { t0:59, t1:66, img:'dark',     tag:'08 / END',        title:['DCTimer','开源 · HarmonyOS'], sub:'GPL-3.0  ·  github.com/emmm00/DCTimer-HarmonyOS', accent:true },
];
window.DUR = 66;
window.EV = [];   // 音效由配乐脚本按时间轴铺，页面不额外声明

/* ---------- 工具 ---------- */
function rr(x,y,w,h,r){
  r = Math.min(r, w/2, h/2);
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function txt(s,x,y,font,color,align='left',base='alphabetic'){
  g.font=font; g.fillStyle=color; g.textAlign=align; g.textBaseline=base; g.fillText(s,x,y);
}
function gradBG(){
  const lg=g.createLinearGradient(0,0,W,H);
  APP_BG.forEach((c,i)=>lg.addColorStop(i/(APP_BG.length-1),c));
  g.fillStyle=lg; g.fillRect(0,0,W,H);
}
function glow(x,y,r,a,color){
  const rg=g.createRadialGradient(x,y,0,x,y,r);
  rg.addColorStop(0,color.replace('ALPHA',(a).toFixed(3)));
  rg.addColorStop(1,color.replace('ALPHA','0'));
  g.fillStyle=rg; g.fillRect(x-r,y-r,r*2,r*2);
}
function hairGrid(a){
  const step=62*S;
  g.lineWidth=1*S;
  for(let x=0,i=0;x<W;x+=step,i++){
    g.strokeStyle='rgba(255,255,255,'+(i%4===0?a*2:a)+')';
    g.beginPath(); g.moveTo(x,0); g.lineTo(x,H); g.stroke();
  }
  for(let y=0,i=0;y<H;y+=step,i++){
    g.strokeStyle='rgba(255,255,255,'+(i%4===0?a*2:a)+')';
    g.beginPath(); g.moveTo(0,y); g.lineTo(W,y); g.stroke();
  }
}
function vignette(str){
  const rg=g.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.95);
  rg.addColorStop(0,'rgba(0,0,0,0)');
  rg.addColorStop(1,'rgba(2,6,14,'+str+')');
  g.fillStyle=rg; g.fillRect(0,0,W,H);
}

/* ---------- 手机框（真实截图） ---------- */
function phone(key, cx, cy, ph, alpha, kbx, kby){
  const im = IMG[key];
  if(!im || !im.complete) return;
  const pw = im.width * (ph / im.height);
  const x = cx - pw/2, y = cy - ph/2;
  const r = 46*S;
  g.save();
  g.globalAlpha = alpha;
  // 外投影
  g.shadowColor='rgba(0,0,0,0.55)'; g.shadowBlur=64*S; g.shadowOffsetY=26*S;
  g.fillStyle='#0a1018'; rr(x,y,pw,ph,r); g.fill();
  g.shadowColor='transparent';
  // 屏幕内容（clip 到圆角，轻微 ken burns）
  g.save();
  rr(x+6*S,y+6*S,pw-12*S,ph-12*S,r-6*S); g.clip();
  const zx = kbx!==undefined ? kbx : 0;
  const zy = kby!==undefined ? kby : 0;
  const z  = 1.035;                      // 极克制的缓推
  const dw = (pw-12*S)*z, dh=(ph-12*S)*z;
  const dx = x+6*S-(dw-(pw-12*S))/2 + zx;
  const dy = y+6*S-(dh-(ph-12*S))/2 + zy;
  g.drawImage(im,dx,dy,dw,dh);
  g.restore();
  // 边框高光
  g.lineWidth=2.2*S; g.strokeStyle='rgba(150,185,240,0.35)';
  rr(x+1,y+1,pw-2,ph-2,r); g.stroke();
  g.restore();
}

/* ---------- 左侧文字浮层 ---------- */
function caption(sh, local, x, y, alpha){
  g.save();
  g.globalAlpha = alpha;
  // 强调短线
  const lineW = 62*S;
  g.fillStyle=ACCENT; rr(x,y,lineW,4*S,2*S); g.fill();
  // 标签
  txt(sh.tag, x, y+42*S, `${16*S}px ${FM}`, 'rgba(140,170,225,0.85)');
  // 主标题（可能两行）
  const t0=sh.title[0], t1=sh.title[1]||'';
  txt(t0, x, y+116*S, `${700} ${88*S}px ${t0.charCodeAt(0)>255?FZ:FH}`, INK);
  if(t1) txt(t1, x, y+116*S+58*S, `${500} ${40*S}px ${FZ}`, 'rgba(214,228,255,0.92)');
  // 副标题
  txt(sh.sub, x, y+116*S+ (t1?118:64)*S, `${22*S}px ${FZ}`, SUB);
  // 进度条
  const barW=340*S, by=y+116*S+(t1?168:114)*S;
  g.fillStyle='rgba(255,255,255,0.10)'; rr(x,by,barW,3*S,2*S); g.fill();
  g.fillStyle=ACCENT; rr(x,by,barW*clamp(local,0,1),3*S,2*S); g.fill();
  g.restore();
}

/* ---------- 转场：截图在手机框内「上滑换屏」 ----------
   换镜时前 0.55s：新截图从手机框底部滑上来盖住旧图。
   做法：把手机框的 clip 区域一分为二，上半旧图、下半新图整体上移。
   简化为：先画旧图，再在手机框 clip 内把新图从 y=ph 平移到 0。
---------------------------------------------------------- */
function phoneTransition(prevKey, curKey, cx, cy, ph, p, alpha){
  // p: 0..1 转场进度
  const imNew = IMG[curKey], imOld = IMG[prevKey];
  if(!imNew || !imNew.complete) return;
  const pw = imNew.width*(ph/imNew.height);
  const x=cx-pw/2, y=cy-ph/2, r=46*S;
  g.save(); g.globalAlpha=alpha;
  g.shadowColor='rgba(0,0,0,0.55)'; g.shadowBlur=64*S; g.shadowOffsetY=26*S;
  g.fillStyle='#0a1018'; rr(x,y,pw,ph,r); g.fill();
  g.shadowColor='transparent';
  g.save();
  rr(x+6*S,y+6*S,pw-12*S,ph-12*S,r-6*S); g.clip();
  const z=1.035, iw=pw-12*S, ih=ph-12*S;
  function draw(im, offY){
    if(!im||!im.complete) return;
    const dw=iw*z, dh=ih*z;
    g.drawImage(im, x+6*S-(dw-iw)/2, y+6*S-(dh-ih)/2+offY, dw, dh);
  }
  draw(imOld, 0);
  const e = back(p, 1.25);
  draw(imNew, ih*(1-e));
  // 强调光带扫过
  const bandY = y+6*S + ih*(1-e);
  g.fillStyle='rgba(120,170,255,0.18)';
  g.fillRect(x+6*S, bandY-8*S, iw, 16*S);
  g.restore();
  g.lineWidth=2.2*S; g.strokeStyle='rgba(150,185,240,0.35)';
  rr(x+1,y+1,pw-2,ph-2,r); g.stroke();
  g.restore();
}

/* ---------- 镜头缝的强调光带 ---------- */
function seamLight(t){
  const seams=[7,15,22,29,36,43,51,59];
  for(const s of seams){
    const d=Math.abs(t-s);
    if(d<0.45){
      const a=(1-d/0.45)*0.5;
      g.save(); g.globalCompositeOperation='lighter';
      const lg=g.createLinearGradient(0,0,W,0);
      lg.addColorStop(0,'rgba(68,138,255,0)');
      lg.addColorStop(0.5,'rgba(120,180,255,'+(a*0.5)+')');
      lg.addColorStop(1,'rgba(68,138,255,0)');
      g.fillStyle=lg; g.fillRect(0,0,W,H);
      g.restore();
    }
  }
}

/* ---------- 开场标题卡（0–2.6s 光扫） ---------- */
function titleCard(t){
  const p = clamp(t/2.2,0,1);
  const e = eio(p);
  const bw = W*0.5;
  const bandX = -bw + (W+bw)*e;
  g.save();
  g.beginPath(); g.rect(bandX-bw,0,bw*2,H); g.clip();
  // 亮态钢蓝字
  txt('DCTimer', W/2, H*0.46, `${700} ${140*S}px ${FH}`, '#EAF2FF', 'center', 'middle');
  txt('HARMONYOS  ·  魔方计时与训练工具', W/2, H*0.46+110*S,
      `${28*S}px ${FZ}`, 'rgba(200,222,255,0.9)','center','middle');
  g.restore();
  // 扫过后整体留一点亮态
  const after = eo(clamp((t-1.5)/1.1,0,1));
  g.save(); g.globalAlpha=after*0.85;
  txt('DCTimer', W/2, H*0.46, `${700} ${140*S}px ${FH}`, 'rgba(226,238,255,1)','center','middle');
  txt('HARMONYOS  ·  魔方计时与训练工具', W/2, H*0.46+110*S,
      `${28*S}px ${FZ}`, 'rgba(190,214,255,0.9)','center','middle');
  g.restore();
}

/* ---------- 主渲染 ---------- */
function shotIndex(t){
  for(let i=0;i<SHOTS.length;i++) if(t<SHOTS[i].t1) return i;
  return SHOTS.length-1;
}
function curKey(sh,t){
  if(sh.img!=='obs') return sh.img;
  // WCA 观察：8 秒线性走完 15→14→13→12（不循环，否则会跳回 15）
  const seq=['obs15','obs14','obs13','obs12'];
  const k=Math.floor((t-sh.t0)/((sh.t1-sh.t0)/4));
  return seq[clamp(k,0,3)];
}

function render(t){
  g.setTransform(1,0,0,1,0,0);
  g.clearRect(0,0,W,H);
  gradBG();
  glow(W*0.18,H*0.16,H*0.62,0.16,'rgba(68,138,255,ALPHA)');
  glow(W*0.86,H*0.88,H*0.55,0.10,'rgba(80,220,190,ALPHA)');
  hairGrid(0.03);

  const i = shotIndex(t);
  const sh = SHOTS[i];
  const prev = SHOTS[Math.max(0,i-1)];
  const local = (t-sh.t0)/(sh.t1-sh.t0);

  // 手机几何：偏右，高约 0.86H
  const ph = H*0.86;
  const cx = W*0.665, cy = H*0.5;
  const TRANS = 0.55;
  const dt = t - sh.t0;

  // 开场镜头：0–2.6s 用标题卡，之后手机升起
  if(i===0){
    if(t<2.6){
      titleCard(t);
    } else {
      const rise = back(clamp((t-2.6)/0.9,0,1),1.2);
      const cy2 = lerp(H*1.35, cy, rise);
      phone('timer', cx, cy2, ph, clamp((t-2.6)/0.5,0,1), 0, 0);
      caption(sh, local, W*0.085, H*0.34, clamp((t-2.9)/0.7,0,1));
    }
  } else if(dt < TRANS && i>0){
    // 换镜：上滑换屏
    const p = clamp(dt/TRANS,0,1);
    phoneTransition(curKey(prev, sh.t0-0.01), curKey(sh,t), cx, cy, ph, p, 1);
    caption(sh, local, W*0.085, H*0.34, clamp(dt/0.4,0,1));
  } else {
    // 稳定镜：极缓 ken burns
    const kp = (t-sh.t0-TRANS)/(sh.t1-sh.t0-TRANS);
    const kb = Math.sin(clamp(kp,0,1)*Math.PI)*6*S;
    phone(curKey(sh,t), cx, cy, ph, 1, 0, -kb);
    caption(sh, local, W*0.085, H*0.34, 1);
  }

  // 右上角常驻品牌字标
  g.save(); g.globalAlpha=0.72;
  txt('DCTimer', W-52*S, 62*S, `${700} ${30*S}px ${FH}`, 'rgba(226,238,255,0.9)','right','middle');
  g.fillStyle=ACCENT; rr(W-52*S-118*S, 84*S, 118*S, 3*S, 2*S); g.fill();
  g.restore();

  seamLight(t);
  vignette(0.55);
}
window.render = render;

/* ---------- 就绪 ---------- */
function resize(){
  W = window.innerWidth; H = window.innerHeight; S = H/1440;
  cv.width = W; cv.height = H;
  render(0);
}
window.addEventListener('resize', resize);

function checkReady(){
  loaded++;
  if(loaded >= Object.keys(SRC).length){
    resize();
    window.READY = true;
  }
}
for(const k in SRC){
  const im = new Image();
  im.onload = checkReady;
  im.onerror = () => { console.error('image failed: '+SRC[k]); checkReady(); };
  im.src = SRC[k];
  IMG[k] = im;
}
// 字体就绪后再兜一次（避免 FOUT 影响首帧）
document.fonts && document.fonts.ready.then(()=>{ if(window.READY) render(0); });
</script>
</body>
</html>
